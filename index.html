<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vol Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/terminal.css?v=fbce5406">
<link rel="stylesheet" href="css/standalone.css?v=b772a65a">
</head>
<body>
<div id="app"></div>
<script src="js/_namespace.js?v=07fccc81"></script>
<script src="js/theme.js?v=a9052c62"></script>
<script src="js/options-math.js?v=9b3b6919"></script>
<script src="js/greeks-math.js?v=baa9b21d"></script>
<script src="js/data/option-strategies.js?v=06fe44f4"></script>
<script src="js/lab-engine.js?v=6106bc0a"></script>
<script src="js/frame.js?v=714c0671"></script>
<script src="js/views/options-lab-view.js?v=19ff46f4"></script>
<script>
(function () {
  window.M1.APP_BRAND = "VOL·LAB";
  window.M1.lib.theme.init();
  var root = document.getElementById("app");
  var LV = window.M1.lib.optionsLabView, F = window.M1.lib.terminalFrame, teardown = null;
  function render() {
    if (teardown) teardown();
    teardown = F.mount(root, { mainCls: "term-opt is-lab", main: LV.render(),
      statusHints: '<kbd>l</kbd> light / dark', statusSegs: '<span class="seg">LAB</span>', remount: render });
    LV.wire(root, { rerender: render });
  }
  render();
})();
</script>
</body>
</html>
